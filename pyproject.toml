[project]
name = "support-triage-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jigar Prajapati", email = "jigar.prajapati48@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
    "langchain-anthropic>=1.7.12",
    "langgraph>=1.2.24",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
]

[project.scripts]
support-triage-agent = "support_triage_agent:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
